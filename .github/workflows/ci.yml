name: CI

# Integração contínua do RateMedia.
# Roda em push e pull request para main/develop. O job final "CI OK" consolida
# todos os outros: use-o como check obrigatório na proteção da branch main.
# O deploy de produção é o último job ("Deploy de produção"): só roda em push
# na main e só depois que o "CI OK" passar. Se algum teste falhar, nada é
# publicado e o site continua na versão anterior.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ───────────────────────── Qualidade de código ─────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Checagem de tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  # ───────────────────────────── Testes Vitest ───────────────────────────
  unit:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:unit

  integration:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:integration

  # ─────────────────────────────── Build ─────────────────────────────────
  # demo:       sem variáveis do Supabase (catálogo de demonstração).
  # configured: com variáveis (placeholders), como em produção na Vercel.
  build:
    name: Build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: demo
            supabase_url: ""
            supabase_key: ""
          - mode: configured
            supabase_url: https://placeholder.supabase.co
            supabase_key: placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Cache do Next.js
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ matrix.mode }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.mjs', 'tailwind.config.ts') }}
          restore-keys: |
            nextjs-${{ matrix.mode }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build de produção
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ matrix.supabase_key }}

  # ───────────────────────── Testes E2E (Playwright) ─────────────────────
  # Build em modo demonstração (sem Supabase): dados previsíveis e nenhum
  # banco real alterado. Só roda depois das verificações rápidas passarem.
  e2e:
    name: Testes E2E (Playwright)
    needs: [lint, typecheck, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Cache do Next.js
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-demo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.mjs', 'tailwind.config.ts') }}
          restore-keys: |
            nextjs-demo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build (modo demonstração)
        run: npm run build

      - name: Versão do Playwright
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache dos navegadores
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Instalar Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar dependências do sistema do Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Testes E2E
        run: npm run test:e2e

      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ─────────────────────────── Performance ───────────────────────────────
  performance:
    name: Testes de performance
    needs: [lint, typecheck, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Cache do Next.js
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-demo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.mjs', 'tailwind.config.ts') }}
          restore-keys: |
            nextjs-demo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build (modo demonstração)
        run: npm run build

      - name: Subir servidor de produção
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$BASE_URL"; then echo "Servidor no ar"; exit 0; fi
            sleep 1
          done
          echo "Servidor não respondeu"; cat server.log; exit 1

      - name: Smoke (1 conexão)
        run: npm run test:perf
        env:
          PERF_PROFILE: smoke

      - name: Carga (10 conexões)
        run: npm run test:perf
        env:
          PERF_PROFILE: load

      - name: Publicar resultados
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: |
            tests/performance/results/
            server.log
          retention-days: 14
          if-no-files-found: ignore

  # ───────────────────────────── Docker ──────────────────────────────────
  docker:
    name: Imagem Docker (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build --tag ratemedia:ci .

      - name: Subir container e checar saúde
        run: |
          docker run -d --name ratemedia -p 3000:3000 ratemedia:ci
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000; then echo "Container saudável"; exit 0; fi
            sleep 1
          done
          echo "Container não respondeu"; docker logs ratemedia; exit 1

      - name: Tamanho da imagem
        if: always()
        run: docker image ls ratemedia:ci

  # ────────────────────────────── Segurança ──────────────────────────────
  secrets-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Gratuito em repositório de conta pessoal. Se o repo for movido para uma
      # organização, é preciso definir o secret GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    name: Auditoria de dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: npm audit (dependências de produção)
        env:
          AUDIT_BLOCKING: ${{ vars.AUDIT_BLOCKING }}
        run: |
          set +e
          npm audit --omit=dev --audit-level=high | tee audit.txt
          code=${PIPESTATUS[0]}
          {
            echo "### npm audit (dependências de produção, nível high+)"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=npm audit::Vulnerabilidades high/critical encontradas. Veja o resumo do job."
            # Para bloquear a pipeline: Settings > Variables > AUDIT_BLOCKING = true
            if [ "$AUDIT_BLOCKING" = "true" ]; then exit 1; fi
          fi
          exit 0


  # ─────────────────── Portão único (check obrigatório da main) ──────────
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - lint
      - typecheck
      - unit
      - integration
      - build
      - e2e
      - performance
      - docker
      - secrets-scan
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado dos jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Algum job da CI falhou ou foi cancelado."
              exit 1
            fi
          done
          echo "Todas as verificações passaram."

  # ───────────────────── Deploy de produção (Vercel) ─────────────────────
  # Só roda em push na main e só se o "CI OK" passar (qualquer falha acima
  # bloqueia o deploy). Etapas:
  #   1. build na própria pipeline: se falhar, nada é publicado;
  #   2. deploy sem apontar o domínio (--skip-domain);
  #   3. promove a versão nova para ratemedia.vercel.app;
  #   4. smoke test no domínio público: se falhar, volta para a versão anterior.
  # Requer o secret VERCEL_TOKEN (Settings > Secrets and variables > Actions).
  deploy:
    name: Deploy de produção (Vercel)
    needs: ci-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://ratemedia.vercel.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_Oztc5A4FQIf5qkD2IrKr2Lbk
      VERCEL_PROJECT_ID: prj_JnXMWfVoQQbexpPTKZHJLa5eLI0q
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@65.14.0
      SITE_URL: https://ratemedia.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Conferir credencial da Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=Deploy::Secret VERCEL_TOKEN não configurado. Nada foi publicado."
            exit 1
          fi

      - name: Versão atual em produção
        id: prev
        run: |
          prev=$(npx --yes "$VERCEL_CLI" inspect "$SITE_URL" --json --token "$VERCEL_TOKEN" | jq -r '.id // .uid // .url')
          echo "Versão atual: $prev"
          echo "deployment=$prev" >> "$GITHUB_OUTPUT"

      - name: Configuração do projeto
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build de produção
        run: npx --yes "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"

      - name: Deploy (sem trocar o domínio ainda)
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN")
          echo "Nova versão: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Promover para produção
        id: promote
        run: npx --yes "$VERCEL_CLI" promote "${{ steps.deploy.outputs.url }}" --yes --token "$VERCEL_TOKEN"

      - name: Smoke test do site publicado
        id: smoke
        run: |
          failed=0
          for path in / /busca /campanhas /login /cadastro /docs /docs/diagramas; do
            code=000
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL$path" || echo 000)
              [ "$code" = "200" ] && break
              sleep 5
            done
            if [ "$code" = "200" ]; then echo "OK    $path"; else echo "FALHA $path -> $code"; failed=1; fi
          done
          exit "$failed"

      - name: Voltar para a versão anterior
        if: failure() && steps.promote.outcome != 'skipped' && steps.prev.outputs.deployment != ''
        run: |
          echo "::error title=Deploy::Falha após o deploy. Voltando para ${{ steps.prev.outputs.deployment }}."
          npx --yes "$VERCEL_CLI" rollback "${{ steps.prev.outputs.deployment }}" --yes --token "$VERCEL_TOKEN"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy de produção"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Versão anterior: ${{ steps.prev.outputs.deployment || 'n/d' }}"
            echo "- Nova versão: ${{ steps.deploy.outputs.url || 'não publicada' }}"
            echo "- Smoke test: ${{ steps.smoke.outcome || 'não executado' }}"
          } >> "$GITHUB_STEP_SUMMARY"
