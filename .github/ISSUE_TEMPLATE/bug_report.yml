name: 🐞 Reportar bug
description: Algo não funciona como deveria.
title: "[Bug]: "
labels: ["bug", "triagem"]
body:
  - type: markdown
    attributes:
      value: Obrigado por reportar! Preencha o máximo possível para conseguirmos reproduzir.
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Acesse /busca
        2. Filtre por ...
        3. Veja o erro
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Autenticação
        - Busca
        - Página da obra / biblioteca
        - Listas / perfil
        - Campanhas de RPG
        - Painel admin
        - Documentação
        - Deploy / Docker / CI
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - Produção (Vercel)
        - Preview de PR
        - Local (npm run dev)
        - Docker
  - type: input
    id: navegador
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 131, Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs ou capturas de tela
      render: shell
