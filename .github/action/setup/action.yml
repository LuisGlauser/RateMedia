name: Setup Node + dependências
description: Configura o Node com cache do npm e instala as dependências com `npm ci`.

inputs:
  node-version:
    description: Versão do Node.js
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Instalar dependências (npm ci)
      shell: bash
      run: npm ci
